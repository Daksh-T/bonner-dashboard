# Builds desktop installers (macOS arm64 + x86_64 DMGs, Windows x64 + arm64
# setup EXEs, Linux tarball) and attaches them to a GitHub Release whenever a
# PR is merged into main.
#
# Cost notes: public repos run free on standard runners. The Windows arm64 leg
# is best-effort (continue-on-error) since the arm64 Python wheel ecosystem is
# still maturing. macos-15-intel is GitHub's last Intel image (until Aug 2027).

name: Release builds

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only on an actual merge (or a manual dispatch), not on closed-unmerged PRs.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: BonnerDashboard-linux-x64.tar.gz
          - os: macos-latest
            artifact: BonnerDashboard-macos-arm64.dmg
          - os: macos-15-intel
            artifact: BonnerDashboard-macos-x86_64.dmg
          - os: windows-latest
            artifact: BonnerDashboard-windows-x64-setup.exe
          - os: windows-11-arm
            artifact: BonnerDashboard-windows-arm64-setup.exe
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned to an exact tag: astral-sh publishes no floating v8 major tag.
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run build

      - name: Package with PyInstaller
        shell: bash
        run: |
          cd backend
          uv sync --extra desktop
          uv run pyinstaller ../packaging/bonner.spec --noconfirm --distpath dist --workpath build

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C backend/dist -czf ${{ matrix.artifact }} BonnerDashboard

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg-stage
          cp -R backend/dist/BonnerDashboard.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Bonner Hour Dashboard" -srcfolder dmg-stage -ov -format UDZO "${{ matrix.artifact }}"

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $outName = "${{ matrix.artifact }}" -replace '\.exe$', ''
          & $iscc packaging\installer.iss /DSourceDir="$PWD\backend\dist\BonnerDashboard" /DOutName="$outName"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "packaging\out\$outName.exe" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 3

  release:
    needs: build
    # Publish whatever succeeded even if the experimental arm64 leg failed.
    if: always() && contains(needs.build.result, 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The merged PR's title becomes the release name and its description the
      # release notes (GitHub's auto-generated notes are appended), so writing
      # a good PR is all it takes to ship a documented release.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ github.event.pull_request.title || format('Build {0}', github.run_number) }}
          body: ${{ github.event.pull_request.body }}
          generate_release_notes: true
          files: artifacts/*

      # Scan the release assets with VirusTotal (free tier) and append the
      # analysis links to the release notes. Best-effort: rate limits or VT
      # hiccups must never block a release.
      - uses: crazy-max/ghaction-virustotal@v5
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          update_release_body: true
          request_rate: 4
          files: |
            artifacts/*
