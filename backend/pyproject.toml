[project]
name = "bonner-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.1",
  "pandas>=2.3.3",
  "python-multipart>=0.0.9",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
# Desktop packaging extras: native window + single-binary builder.
# Install with:  uv sync --extra desktop
desktop = [
  "pywebview>=5.3",
  "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
